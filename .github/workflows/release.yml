# Builds every installer when a version tag is pushed (git tag v0.3.1 && git push origin v0.3.1)
# and puts them on a DRAFT release. Look the draft over, then press "Publish release". See docs/RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version' desktop/Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::The tag says $version but desktop/Cargo.toml says $cargo_version. Change the version, commit, and tag again."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (.deb, .tar.gz)
    needs: prepare
    runs-on: ubuntu-22.04 # an older system, so the program also runs on older distributions
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Build
        working-directory: desktop
        run: cargo build --release --locked -p bridge-gui
      - name: Packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          cd desktop
          cargo deb -p bridge-gui --no-build --no-strip --output "../dist/bridge-app_${VERSION}_amd64.deb"
          cd ..
          stage="bridge-app-${VERSION}-linux-x86_64"
          mkdir "$stage"
          cp desktop/target/release/bridge-app packaging/linux/bridge.desktop packaging/icons/bridge-256.png LICENSE "$stage/"
          tar -czf "dist/Bridge-${VERSION}-linux-x86_64.tar.gz" "$stage"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*

  arch:
    name: Arch Linux (.pkg.tar.zst)
    needs: prepare
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm git rust gtk3 libayatana-appindicator xdotool alsa-lib
      - uses: actions/checkout@v4
      - name: Build with makepkg
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          repo=$(sed -n 's/^_repo=//p' packaging/arch/PKGBUILD)
          mkdir -p /tmp/pkg dist
          # the PKGBUILD expects the tarball of the tagged source; build it here instead of downloading it
          git archive --prefix="${repo}-${VERSION}/" -o "/tmp/pkg/bridge-app-${VERSION}.tar.gz" HEAD
          sed "s/^pkgver=.*/pkgver=${VERSION}/" packaging/arch/PKGBUILD > /tmp/pkg/PKGBUILD
          useradd -m builder
          chown -R builder /tmp/pkg
          su builder -c 'cd /tmp/pkg && makepkg -f --noconfirm'
          cp /tmp/pkg/*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-arch
          path: dist/*.pkg.tar.zst

  windows:
    name: Windows (setup .exe, .zip)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build
        working-directory: desktop
        run: cargo build --release --locked -p bridge-gui
      - name: Installer and zip
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          choco install nsis -y --no-progress
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = "$PWD\desktop\target\release\bridge-app.exe"
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DVERSION=$env:VERSION" "/DEXE=$exe" "/DROOT=$PWD" "/DOUT=$PWD\dist\Bridge-$env:VERSION-windows-x64-setup.exe" packaging\windows\bridge.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          New-Item -ItemType Directory -Force "portable\Bridge" | Out-Null
          Copy-Item $exe, LICENSE "portable\Bridge"
          Compress-Archive -Path "portable\Bridge" -DestinationPath "dist\Bridge-$env:VERSION-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*

  macos:
    name: macOS (.dmg)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build both Mac architectures
        working-directory: desktop
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          cargo build --release --locked -p bridge-gui --target aarch64-apple-darwin
          cargo build --release --locked -p bridge-gui --target x86_64-apple-darwin
      - name: Disk image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          lipo -create -output dist/bridge-app \
            desktop/target/aarch64-apple-darwin/release/bridge-app \
            desktop/target/x86_64-apple-darwin/release/bridge-app
          bash packaging/macos/build-dmg.sh dist/bridge-app "$VERSION" "dist/Bridge-${VERSION}-macos.dmg"
          rm dist/bridge-app
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*

  android:
    name: Android (.apk)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the Android app is NOT part of this release. See docs/RELEASING.md."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bridge.jks"
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.have == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: steps.key.outputs.have == 'true'
        uses: gradle/actions/setup-gradle@v4
      - name: Build and sign
        if: steps.key.outputs.have == 'true'
        working-directory: android
        env:
          BRIDGE_KEYSTORE: ${{ runner.temp }}/bridge.jks
          BRIDGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BRIDGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BRIDGE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CODE: ${{ needs.prepare.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PappVersion="$VERSION" -PappVersionCode="$CODE"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/Bridge-${VERSION}-android.apk"
      - if: steps.key.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*

  publish:
    name: Draft release
    needs: [prepare, linux, arch, windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          ls -l
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # a release for this tag already exists (made on the website): add the files to it
            gh release upload "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --draft --title "Bridge $VERSION" --generate-notes
          fi
